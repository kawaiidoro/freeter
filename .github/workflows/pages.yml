name: Validate and deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Verify runtime bundle and core behavior
        run: |
          node scripts/build-vendor.mjs --check
          node scripts/build-site.mjs --check
          node scripts/build-owner-setup.mjs --check
          node --check site.js
          npm test
          node scripts/security-audit.mjs
      - name: Package public static files
        run: |
          mkdir _site
          cp -- *.html style.css brand.css site.js sw.js icon.svg manifest.webmanifest robots.txt sitemap.xml version.json .nojekyll _site/
          cp -R -- assets _site/assets
          cp -R -- vendor _site/vendor
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  browser-check:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEST_BASE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Prepare isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/dangi-browser" --no-package-lock --no-save playwright@1.64.1
          "$RUNNER_TEMP/dangi-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/dangi-browser/node_modules" >> "$GITHUB_ENV"
          echo "TEST_OUTPUT_DIR=$RUNNER_TEMP/dangi-alba-live-tests" >> "$GITHUB_ENV"
      - name: Verify the published website in Chromium
        run: |
          node tests/security-browser.mjs
          node tests/account-browser.mjs
          node tests/weather-browser.mjs
          node tests/refinements-browser.mjs
          node tests/rest-adjustments-browser.mjs
          node tests/update-recovery.mjs
          node tests/browser.mjs
          node tests/features.mjs
          node tests/applications-browser.mjs
          node tests/settings-browser.mjs
          node tests/mobile-layout-browser.mjs
          node tests/brand.mjs
          node tests/dashboard-browser.mjs
          node tests/editor.mjs
      - name: Verify public backend security
        if: always()
        run: npm run check:backend
      - name: Verify public weather service
        if: always()
        run: node scripts/weather-check.mjs
      - name: Save browser verification results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-site-browser-results
          path: ${{ env.TEST_OUTPUT_DIR }}
          if-no-files-found: ignore
