name: Validate and deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify runtime bundle and core behavior
        run: |
          node scripts/build-site.mjs --check
          node --check site.js
          node --test tests/core.test.mjs
      - name: Package public static files
        run: |
          mkdir _site
          cp -- *.html style.css brand.css site.js peer.js sw.js icon.svg manifest.webmanifest robots.txt sitemap.xml .nojekyll _site/
          cp -R -- assets _site/assets
          cp -R -- vendor _site/vendor
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  browser-check:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEST_BASE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/dangi-browser" --no-package-lock --no-save playwright@1.64.1
          "$RUNNER_TEMP/dangi-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/dangi-browser/node_modules" >> "$GITHUB_ENV"
          echo "TEST_OUTPUT_DIR=$RUNNER_TEMP/dangi-alba-live-tests" >> "$GITHUB_ENV"
      - name: Verify the published website in Chromium
        run: |
          node tests/browser.mjs
          node tests/features.mjs
          node tests/brand.mjs
          node tests/editor-sync.mjs
      - name: Save browser verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-site-browser-results
          path: ${{ env.TEST_OUTPUT_DIR }}
          if-no-files-found: ignore
